[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]

[tool.coverage.run]
source = ["api/app"]

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]