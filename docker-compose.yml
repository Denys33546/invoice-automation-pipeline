services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      EXTRACTOR_API_KEY: ${EXTRACTOR_API_KEY:?Set EXTRACTOR_API_KEY in the .env file}
    ports:
      - "127.0.0.1:8010:8000"  # only reachable from this computer
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.7
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in the .env file}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"  # local http only; remove behind HTTPS
      GENERIC_TIMEZONE: America/Toronto
      TZ: America/Toronto
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:8025:8025"  # web interface with the caught emails
    restart: unless-stopped

volumes:
  n8n_data: